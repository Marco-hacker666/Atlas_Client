name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# If you push again while a run is in progress, cancel the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned to the current LTS image. `ubuntu-latest` is scheduled to jump to
    # Ubuntu 26 on 2026-10-19, which risks breaking the Java 8 / Forge 1.8.9
    # toolchain. Revisit this pin once Ubuntu 26 is verified to build cleanly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Gradle runs on 17; the mod itself is compiled with the Java 8 toolchain.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17

      # Caches Gradle dependencies + build outputs. Biggest build-time win for Loom/Forge.
      # Read-only on anything other than main so PRs don't poison the shared cache.
      # Gradle 8.8, the same as release.yml. With the wrapper's 8.14.6, remapJar
      # writes a jar holding only the shadow jar, nested: no mixins.atlas.json,
      # no mcmod.info, no classes. Forge cannot load it, yet the build is green.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Applies atlas-ui.patch when it is in the repository and not applied yet.
      - name: Apply UI update patch
        run: |
          if [ -f atlas-ui.patch ] && git apply --check atlas-ui.patch 2>/dev/null; then
            git apply atlas-ui.patch
            echo "atlas-ui.patch applied"
          else
            echo "no patch to apply"
          fi

      - name: Build
        run: |
          gradle build --no-daemon --stacktrace

      # Same check as release.yml: fail instead of uploading a jar Forge cannot load.
      - name: Check the jar is the client
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          python3 - "$JAR" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          mixins = [n for n in names if n.startswith('atlas/mixin/') and n.count('/') == 2 and n.endswith('.class')]
          nested = [n for n in names if n.endswith('.jar')]
          print(sys.argv[1], len(names), 'entries,', len(mixins), 'mixin classes, nested jars:', nested)
          if 'mixins.atlas.json' not in names or 'mcmod.info' not in names or len(mixins) < 50 or nested:
              print('::error::The built jar is not a loadable client.')
              sys.exit(1)
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: Atlas-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Debug CI test failures without re-running the whole build.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore
