name: Build (experimental)

# Experimental twin of build.yml, added 2026-10-15.
#
# Why it exists, with the evidence:
#   * build.yml's artifact cannot be loaded by Forge. Built with the wrapper's
#     Gradle 8.14.6, remapJar writes a jar holding only a *nested* shadow jar:
#     3 entries, no mixins.myau.json, no mcmod.info, no classes (run
#     38732199430, artifact Atlas-jar, 25.8 MB) while the run is green. It is
#     the same regression release.yml documents for v2.1.3, and it is what
#     every green Build run uploads today. Release v2.2.0, built with Gradle
#     8.8, is a healthy 6051-entry / 27.3 MB client.
#   * So this workflow builds with 8.8 (overridable when dispatched) and then
#     checks the jar the way release.yml does: once before uploading, once
#     after downloading the artifact. A green run here means a client that
#     loads, not merely a set of tasks that exited 0.
#   * It also restores Loom's Minecraft/mappings cache and runs on pull
#     requests, neither of which build.yml does.
#
# Once this has been green for a while, delete build.yml: running both costs a
# full build on every push to main.

on:
  workflow_dispatch:
    inputs:
      gradle-version:
        description: 'Gradle to build with. 8.8 is the known-good release toolchain; 8.14.6 reproduces the broken-jar regression.'
        required: true
        type: choice
        default: '8.8'
        options:
          - '8.8'
          - '8.14.6'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# If you push again while a run is in progress, cancel the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Fails in seconds instead of after a full Loom setup: the wrapper's own
  # integrity, the version the jar and artifact names come from, and the two
  # resources without which the built jar cannot load at all.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7

      # Runs before any Gradle code from the checkout is executed.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Read the version and check required resources
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^\s*version\s*=' gradle.properties | head -1 | sed -E 's/^\s*version\s*=\s*//; s/\s*$//')
          if [ -z "$VERSION" ]; then
            echo "::error::gradle.properties declares no version, so the jar name would be wrong."
            exit 1
          fi
          for f in src/main/resources/mixins.myau.json src/main/resources/mcmod.info; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing; Forge would not load the client built from this commit."
              exit 1
            fi
          done
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo "version=$VERSION"
            echo "artifact=Atlas-$VERSION-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Preflight"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| version | \`$VERSION\` |"
            echo "| commit | \`$SHORT_SHA\` |"
            echo "| Gradle | \`${{ github.event.inputs.gradle-version || '8.8' }}\` |"
            echo "| atlas-ui.patch | $([ -f atlas-ui.patch ] && echo present || echo 'absent (gitignored, so never in CI)') |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build client jar
    needs: preflight
    # Pinned to the current LTS image. `ubuntu-latest` is scheduled to jump to
    # Ubuntu 26 on 2026-10-19, which risks breaking the Java 8 / Forge 1.8.9
    # toolchain. Revisit this pin once Ubuntu 26 is verified to build cleanly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.check-jar.outputs.sha256 }}
      jar: ${{ steps.check-jar.outputs.jar }}
    steps:
      - uses: actions/checkout@v7

      # Gradle runs on 17; the mod itself is compiled with the Java 8 toolchain.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17

      # Pinned Gradle rather than ./gradlew: see the header comment. Caches
      # Gradle dependencies; read-only off main so PRs cannot poison the cache
      # the main builds restore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ github.event.inputs.gradle-version || '8.8' }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # What a cold Forge 1.8.9 runner pays for on top of dependencies: the
      # Minecraft client, the MCP mappings, and their remapped output. Keyed on
      # the build scripts, so editing any of them starts a fresh cache.
      # Restore and save are separate: only main writes (see the save step), so
      # an unmerged branch cannot seed what the main build then restores. The
      # key expression is repeated in the save step and must stay identical.
      - name: Restore Loom cache (Minecraft, mappings, remapped jars)
        id: loom-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
            build/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            loom-${{ runner.os }}-

      # Applies atlas-ui.patch when it is in the repository and not applied yet.
      - name: Apply UI update patch
        run: |
          if [ -f atlas-ui.patch ] && git apply --check atlas-ui.patch 2>/dev/null; then
            git apply atlas-ui.patch
            echo "atlas-ui.patch applied"
          else
            echo "no patch to apply"
          fi

      - name: Build
        run: gradle build --no-daemon --stacktrace

      # The check release.yml runs, and the reason this workflow exists: the
      # nested-jar regression exits 0 out of every Gradle task, so only the
      # contents of the jar tell a client from a wrapper around a client.
      - name: Check the jar is the client
        id: check-jar
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          {
            echo "jar=$(basename "$JAR")"
            echo "sha256=$(sha256sum "$JAR" | cut -d' ' -f1)"
            echo "bytes=$(stat -c %s "$JAR")"
          } >> "$GITHUB_OUTPUT"
          python3 - "$JAR" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          mixins = [n for n in names if n.startswith('myau/mixin/') and n.count('/') == 2 and n.endswith('.class')]
          nested = [n for n in names if n.endswith('.jar')]
          print(f'{path}: {len(names)} entries, {len(mixins)} mixin classes, nested jars: {nested}')
          if 'mixins.myau.json' not in names or 'mcmod.info' not in names or len(mixins) < 50 or nested:
              print('::error::The built jar is not a loadable client, so it is not uploaded.')
              sys.exit(1)
          PY

      # Written after the build, because that is when Loom has filled the
      # cache. Not on PRs: a branch that is never merged must not decide what
      # the main build restores.
      - name: Save Loom cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
            build/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'settings.gradle.kts') }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.preflight.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Always, not only on failure: a passing run's report is just as useful,
      # and build.yml throws it away.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test-results/**/*.xml
            build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      # One place to see what was built, how fast, and whether the tests passed,
      # without reading the job log.
      - name: Summarise
        if: always()
        env:
          JAR: ${{ steps.check-jar.outputs.jar }}
          SHA256: ${{ steps.check-jar.outputs.sha256 }}
          BYTES: ${{ steps.check-jar.outputs.bytes }}
          GRADLE_USED: ${{ github.event.inputs.gradle-version || '8.8' }}
          OUTCOME: ${{ job.status }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          seconds = 0.0
          for path in glob.glob('build/test-results/test/*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              seconds += float(root.get('time', 0))

          jar = os.environ.get('JAR') or 'n/a'
          sha = os.environ.get('SHA256') or 'n/a'
          raw = os.environ.get('BYTES') or ''
          size = f'{int(raw) / 1048576:.1f} MB' if raw.isdigit() else 'n/a'

          print('### Build')
          print()
          print('| | |')
          print('| --- | --- |')
          print(f'| result | {os.environ.get("OUTCOME", "unknown")} |')
          print(f'| Gradle | `{os.environ.get("GRADLE_USED", "8.8")}` |')
          print(f'| jar | `{jar}` ({size}) |')
          print(f'| sha256 | `{sha}` |')
          print(f'| tests | {tests} run, {failures} failed, {errors} errored, {skipped} skipped ({seconds:.1f}s) |')
          PY

  # The build job checked the jar it produced. This checks the bytes a user
  # actually downloads, so the artifact itself is covered, not just the build.
  verify-artifact:
    name: Verify the uploaded artifact
    needs: [ preflight, build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.preflight.outputs.artifact }}
          path: dist

      - name: Re-check the downloaded jar
        run: |
          set -euo pipefail
          JAR=$(ls dist/*.jar | head -1)
          python3 - "$JAR" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          mixins = [n for n in names if n.startswith('myau/mixin/') and n.count('/') == 2 and n.endswith('.class')]
          nested = [n for n in names if n.endswith('.jar')]
          print(f'{sys.argv[1]}: {len(names)} entries, {len(mixins)} mixin classes, nested jars: {nested}')
          if 'mixins.myau.json' not in names or 'mcmod.info' not in names or len(mixins) < 50 or nested:
              print('::error::The uploaded artifact is not a loadable client.')
              sys.exit(1)
          PY
          GOT=$(sha256sum "$JAR" | cut -d' ' -f1)
          WANT='${{ needs.build.outputs.sha256 }}'
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Artifact hash $GOT does not match the jar the build job checked ($WANT)."
            exit 1
          fi
          {
            echo "### Artifact"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| name | \`${{ needs.preflight.outputs.artifact }}\` |"
            echo "| file | \`$(basename "$JAR")\` |"
            echo "| sha256 | \`$GOT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
